appId: com.history.desktop
productName: hi story
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - package.json
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.png
extraResources:
  - from: resources/
    to: resources/
    filter:
      - "*.db"
